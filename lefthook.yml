output:
  - summary
  - failure
  - execution_out

pre-commit:
  commands:
    check:
      run: bin/check
    gitleaks:
      run: gitleaks git --staged --no-banner --redact --config .gitleaks.toml

pre-push:
  commands:
    rm-test:
      run: bin/rm-test
    sublime-session-backup-test:
      run: bin/sublime-session-backup-test
